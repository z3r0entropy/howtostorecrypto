name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check (astro check)
        run: npm run typecheck

      - name: Build
        env:
          SITE_URL: https://howtostorecrypto.com
          BASE_PATH: /
          NODE_ENV: production
        run: npm run build
