<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How to Store Crypto — a calm guide to self-custody">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="0.5" stop-color="#e8d8f5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#cfe1f5"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a68"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <radialGradient id="frost" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#e8f3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#aac6e6" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frost ring on the right -->
  <circle cx="970" cy="315" r="220" fill="url(#frost)"/>
  <circle cx="970" cy="315" r="220" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

  <!-- Diamond logo + brand mark -->
  <g transform="translate(80, 90)" fill="none" stroke="#1f3a68" stroke-width="2.4" stroke-linejoin="round">
    <path d="M28 4 L52 14 L52 38 L28 50 L4 38 L4 14 Z"/>
    <path d="M28 16 L42 27 L28 38 L14 27 Z"/>
  </g>
  <text x="140" y="128" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="500" fill="#0c1a2e" letter-spacing="-0.5">How to Store Crypto</text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="500" fill="#0c1a2e" letter-spacing="-3">How to store crypto,</text>
  <text x="80" y="390" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="92" font-weight="500" fill="url(#ink)" letter-spacing="-3">without the panic.</text>

  <!-- Subhead -->
  <text x="80" y="450" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#3b4a63">
    Self-custody · seed phrase backup · multisig · inheritance
  </text>

  <!-- Trust strip -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#3b4a63">
    <circle cx="92" cy="540" r="4" fill="#2f9468"/>
    <text x="108" y="546">No products</text>
    <circle cx="252" cy="540" r="4" fill="#2f9468"/>
    <text x="268" y="546">No affiliates</text>
    <circle cx="412" cy="540" r="4" fill="#2f9468"/>
    <text x="428" y="546">No tracking</text>
    <circle cx="552" cy="540" r="4" fill="#2f9468"/>
    <text x="568" y="546">Vendor-neutral</text>
  </g>

  <!-- Right-side accent: the 24 -->
  <g transform="translate(880, 220)">
    <rect x="0" y="0" width="180" height="180" rx="32" fill="#ffffff" fill-opacity="0.6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="90" y="118" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="500" fill="url(#ink)" letter-spacing="-4">24</text>
    <text x="90" y="148" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6f7e94" letter-spacing="2">WORDS · BIP-39</text>
  </g>

  <!-- URL footer -->
  <text x="80" y="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#6f7e94" letter-spacing="0.5">howtostorecrypto.com</text>
</svg>
