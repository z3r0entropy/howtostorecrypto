<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="g1" cx="80%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#cfe1f5"/>
      <stop offset="100%" stop-color="#f4f8fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e8d8f5"/>
      <stop offset="100%" stop-color="#f4f8fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#d8eaf8"/>
      <stop offset="100%" stop-color="#f4f8fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="500" fill="#f4f8fc"/>
  <rect width="1500" height="500" fill="url(#g1)"/>
  <rect width="1500" height="500" fill="url(#g2)"/>
  <rect width="1500" height="500" fill="url(#g3)"/>

  <!-- Centered mark + wordmark + tagline -->
  <g transform="translate(750 250)">
    <!-- mark, centered above text -->
    <g transform="translate(-72 -150) scale(6)" fill="none" stroke="#1f3a68" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 2 L20 6.5 L20 16.5 L12 21 L4 16.5 L4 6.5 Z"/>
      <path d="M12 7 L16 11.5 L12 16 L8 11.5 Z"/>
    </g>
    <!-- wordmark -->
    <text x="0" y="50" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="64" letter-spacing="-1.6" fill="#0c1a2e">How to Store Crypto</text>
    <!-- tagline -->
    <text x="0" y="100" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" letter-spacing="-0.2" fill="#3b4a63">A practical guide to self-custody.</text>
  </g>
</svg>
